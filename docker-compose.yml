services:
  zqr-app:
    build: .
    image: zqr-app:latest
    container_name: zqr-app
    restart: unless-stopped
    ports:
      - "8122:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ZQR_DB_PATH=/app/data/zqr.db
    volumes:
      - zqr-data:/app/data
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true

volumes:
  zqr-data:
